<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Node in the browser</title>
  <style>
    :root { color-scheme: light dark; --ink: #1d2433; --paper: #f4f6fb; --accent: #3b6ef5; }
    @media (prefers-color-scheme: dark) { :root { --ink: #e6e9f2; --paper: #12151d; --accent: #7d9cff; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 34rem; padding: 2rem; }
    h1 { margin: 0 0 .5rem; font-size: 1.8rem; }
    code { font: 14px ui-monospace, monospace; }
    .clock { font: 600 2.4rem ui-monospace, monospace; color: var(--accent); margin: 1rem 0; }
  </style>
</head>
<body>
  <main>
    <h1>This Node server runs in your browser tab.</h1>
    <p>Edit <code>public/index.html</code> or <code>server.js</code>. nodemon restarts the server, and this pane shows the change.</p>
    <div class="clock" id="clock">--:--:--</div>
    <p id="meta"></p>
  </main>
  <script>
    async function tick() {
      const t = await (await fetch("/api/time")).json();
      document.getElementById("clock").textContent = new Date(t.now).toLocaleTimeString();
      document.getElementById("meta").textContent = `Node ${t.node}, started ${new Date(t.started).toLocaleTimeString()}`;
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
